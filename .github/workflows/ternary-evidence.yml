name: Ternary evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --import tsx benchmarks/compare-codecs.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codec-evidence-${{ matrix.os }}
          path: benchmarks/results/codec-comparison.json
